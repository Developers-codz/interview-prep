<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">Traffic Light</div>
    <div class="traffic-light">
        <div class="light red" id="red"></div>
        <div class="light yellow" id="yellow"></div>
        <div class="light green" id="green"></div>
      </div>
      
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>

      <div class="circular-progress-wrapper">
        <div class="title">Circular Progressbar</div>
        <div class="circular-progress" id="circular-progress"></div>
    </div>
    <div class="Stopwatch-wrapper">
        <div class="title">Stopwatch</div>
        <div class="stopwatch-time" id="stopwatch-time">00:00:00</div>
        <button id="startTimerBtn">Start</button>
        <button id="stopTimeBtn">Stop</button>
        <button id="resetTimeBtn">Reset</button>
    </div>

    <script src="day28Oct.js"></script>
</body>
</html>
